name: WASP Forensic Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Test Suite (29 Tests)
        run: |
          python -m pytest -v

      - name: Run Live Forensic Demonstration
        run: |
          python run_demo.py

      - name: Verify Exported .wasp Bundle Container
        run: |
          python wasp.py bundle verify run_artifacts/CASE-2026-LIVE.wasp --passphrase "ForensicInvestigatorKey2026!"
